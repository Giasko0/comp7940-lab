services:
  bot:
    build: .
    container_name: comp7940-bot
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - ./config.ini:/comp7940-lab/config.ini:ro
    networks:
      - comp7940-network

  redis:
    image: redis:7-alpine
    container_name: comp7940-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - comp7940-network

volumes:
  redis_data:

networks:
  comp7940-network:
    driver: bridge
